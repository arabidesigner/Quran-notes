name: Deploy to GitHub Pages

# Build the PWA and publish it to GitHub Pages so it can be opened on any
# device (iPad Pro, foldables, desktop). Requires a one-time setup:
#   repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/quran-annotation-app-cx9wp4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Serve from https://<owner>.github.io/<repo>/
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA + Jekyll safety
        # 404.html lets deep links resolve; .nojekyll stops Pages from
        # stripping files that start with an underscore.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
